name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: rarebit-one/.github/.github/workflows/reusable-gem-ci.yml@v2
    with:
      ruby-versions: '["4.0.0","4.0.1","4.0.2","4.0.3","4.0.4"]'
      lint-command: bin/rubocop -f github
      # `extra-lint-commands` is the reusable workflow's ONLY hook for extra
      # steps, and this gem was passing just `lint-command` — so bundler-audit
      # ran nowhere. It is a dev dependency here (Gemfile:21) and lefthook's
      # pre-push runs brakeman but not the audit, so nothing checked the
      # lockfile at any point.
      #
      # That gap is not hypothetical: standard_singpass had the identical
      # omission and accumulated 22 advisories across 7 gems — two of them High
      # severity — through a long run of green builds. It matters more here than
      # in most of the family because this gem COMMITS its Gemfile.lock, so a
      # vulnerable version can sit pinned indefinitely. The gems that gitignore
      # their lockfile re-resolve every CI run and drift back to patched
      # versions on their own.
      #
      # `--update` is deliberate: a newly published advisory can turn CI red
      # with no code change. For a security gate that is the point — a red build
      # you did not cause beats a stale advisory DB passing quietly.
      # brakeman is added alongside for the same reason: it ran only in
      # lefthook's pre-push, which a `LEFTHOOK=0` push or a bot-authored PR
      # skips entirely. CI is the gate that always runs. (Verified clean —
      # 0 warnings — so this does not turn the build red on arrival.)
      extra-lint-commands: |
        bundle exec brakeman --no-pager --force
        bundle exec bundler-audit --update

  # The suite again, against PostgreSQL with a `jsonb` metadata column — the
  # storage every consumer app uses. The dummy app is in-memory SQLite, which
  # keeps JSON as text in insertion order and serialises writers, so it is
  # structurally blind to storage-side behaviour: the metadata key-order bug
  # (fundbright/delivery-ops#689) sat behind a green SQLite suite while 67% of
  # one production log failed verify_chain. The SQLite matrix above stays.
  #
  # A separate job because the reusable gem CI has no `services:` hook. It
  # needs a container runtime, so it stays on a GitHub-hosted runner.
  test-postgres:
    name: test (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: standard_audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --mount type=tmpfs,destination=/var/lib/postgresql/data
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/standard_audit_test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: 4.0.4
          bundler-cache: true

      - name: Run tests on PostgreSQL
        run: bundle exec rspec
